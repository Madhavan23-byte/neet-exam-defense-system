version: "3.9"

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: bsea-postgres
    environment:
      POSTGRES_DB: bsea_db
      POSTGRES_USER: bsea_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-<DB_PASSWORD>}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsea_user -d bsea_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bsea-internal

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bsea-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-<REDIS_PASSWORD>} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--auth", "${REDIS_PASSWORD:-<REDIS_PASSWORD>}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bsea-internal

  # ─── MinIO (S3-compatible object store) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: bsea-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-<MINIO_ACCESS_KEY>}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-<MINIO_SECRET_KEY>}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsea-internal

  # ─── MinIO bucket init ─────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: bsea-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set bsea http://minio:9000 ${MINIO_ACCESS_KEY:-<MINIO_ACCESS_KEY>} ${MINIO_SECRET_KEY:-<MINIO_SECRET_KEY>};
      mc mb --ignore-existing bsea/bsea-questions;
      mc mb --ignore-existing bsea/bsea-configs;
      mc mb --ignore-existing bsea/bsea-audit;
      echo 'Buckets initialized';
      "
    networks:
      - bsea-internal

  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsea-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://bsea_user:${POSTGRES_PASSWORD:-<DB_PASSWORD>}@db:5432/bsea_db
      SYNC_DATABASE_URL: postgresql://bsea_user:${POSTGRES_PASSWORD:-<DB_PASSWORD>}@db:5432/bsea_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-<REDIS_PASSWORD>}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-<MINIO_ACCESS_KEY>}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-<MINIO_SECRET_KEY>}
      MINIO_SECURE: "false"
      SECRET_KEY: ${SECRET_KEY:-<JWT_SECRET_KEY>}
      MOCK_KMS_MASTER_KEY: ${MOCK_KMS_MASTER_KEY:-<MOCK_KMS_MASTER_KEY>}
      MOCK_KMS_SIGNING_KEY: ${MOCK_KMS_SIGNING_KEY:-<MOCK_SIGNING_KEY>}
      ENVIRONMENT: production-local
      GUNICORN_WORKERS: 4
      LOG_LEVEL: INFO
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - bsea-internal
      - bsea-public

  # ─── React Frontend (Nginx Production Packaging) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bsea-frontend
    ports:
      - "80:80"
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bsea-public

networks:
  bsea-internal:
    driver: bridge
    internal: true
  bsea-public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
