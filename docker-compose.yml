version: "3.9"

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: bsea-postgres
    environment:
      POSTGRES_DB: bsea_db
      POSTGRES_USER: bsea_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bsea_dev_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsea_user -d bsea_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bsea-internal

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bsea-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-bsea_redis_pass} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--auth", "${REDIS_PASSWORD:-bsea_redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bsea-internal

  # ─── MinIO (S3-compatible object store) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: bsea-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-bsea_minio_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-bsea_minio_secret_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsea-internal

  # ─── MinIO bucket init ─────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: bsea-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set bsea http://minio:9000 ${MINIO_ACCESS_KEY:-bsea_minio_access} ${MINIO_SECRET_KEY:-bsea_minio_secret_change_me};
      mc mb --ignore-existing bsea/bsea-questions;
      mc mb --ignore-existing bsea/bsea-configs;
      mc mb --ignore-existing bsea/bsea-audit;
      echo 'Buckets initialized';
      "
    networks:
      - bsea-internal

  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsea-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://bsea_user:${POSTGRES_PASSWORD:-bsea_dev_password_change_me}@db:5432/bsea_db
      SYNC_DATABASE_URL: postgresql://bsea_user:${POSTGRES_PASSWORD:-bsea_dev_password_change_me}@db:5432/bsea_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-bsea_redis_pass}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-bsea_minio_access}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-bsea_minio_secret_change_me}
      MINIO_SECURE: "false"
      SECRET_KEY: ${SECRET_KEY:-bsea_jwt_secret_change_me_in_production_minimum_64_chars_abc123}
      MOCK_KMS_MASTER_KEY: ${MOCK_KMS_MASTER_KEY:-bsea_kms_master_key_change_me_32ch}
      MOCK_KMS_SIGNING_KEY: ${MOCK_KMS_SIGNING_KEY:-bsea_ed25519_seed_32_bytes_change_}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - bsea-internal
      - bsea-public

  # ─── React Frontend (dev server) ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: bsea-frontend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_APP_NAME: B-SEA
      VITE_ENVIRONMENT: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - bsea-public

networks:
  bsea-internal:
    driver: bridge
    internal: true
  bsea-public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
